<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Illuminux Company System</title>

    <!-- Connects index.html to the CSS file -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Website header -->
    <header class="header">
        <button class="brand" type="button" data-page="landing">
            <span class="brand-name">
                <span class="orange-letter">I</span>LLUMINUX
            </span>

            <span class="brand-line"></span>
            <span class="brand-subtitle">GENERAL MERCH CO.</span>
        </button>

    <img
        src="./assets/illuminux-logo.png"
        class="header-logo"
        alt="Illuminux logo"
        
    >
    </header>

    <main class="main-content">

        <section class="auth-card">
            <div class="card-content">

                <!-- Landing page -->
                <div class="page active" id="landingPage">

                    <button
                        class="main-button"
                        type="button"
                        data-page="signin"
                    >
                        Sign In
                    </button>

                    <button
                        class="main-button"
                        type="button"
                        data-page="signup"
                    >
                        Sign Up
                    </button>

                    <p class="description">
                        Enter your account<br>
                        details to access the<br>
                        company system.
                    </p>
                </div>

                <!-- Sign-in page -->
                <div class="page" id="signinPage">

                    <button
                        class="main-button page-title"
                        type="button"
                        data-page="landing"
                    >
                        Sign In
                    </button>

                    <form id="signinForm">

                        <div class="input-container">
                            <label for="signinEmail">Email</label>

                            <input
                                type="email"
                                id="signinEmail"
                                name="email"
                                autocomplete="email"
                                required
                            >
                        </div>

                        <div class="input-container">
                            <label for="signinPassword">Password</label>

                            <input
                                type="password"
                                id="signinPassword"
                                name="password"
                                autocomplete="current-password"
                                minlength="6"
                                required
                            >

                            <button
                                class="show-password"
                                type="button"
                                data-password="signinPassword"
                            >
                                Show
                            </button>
                        </div>

                        <p class="message" id="signinMessage"></p>

                        <button class="submit-button" type="submit">
                            Enter System
                        </button>
                    </form>

                    <p class="description form-description">
                        Enter your account<br>
                        details to access the<br>
                        company system.
                    </p>

                    <button
                        class="switch-button"
                        type="button"
                        data-page="signup"
                    >
                        No account yet? Sign up
                    </button>
                </div>

                <!-- Sign-up page -->
                <div class="page" id="signupPage">

                    <button
                        class="main-button page-title"
                        type="button"
                        data-page="landing"
                    >
                        Sign Up
                    </button>

                    <form id="signupForm">

                        <div class="input-container">
                            <label for="signupEmail">Email</label>

                            <input
                                type="email"
                                id="signupEmail"
                                name="email"
                                autocomplete="email"
                                required
                            >
                        </div>

                        <div class="input-container">
                            <label for="signupPassword">
                                Create Password
                            </label>

                            <input
                                type="password"
                                id="signupPassword"
                                name="password"
                                autocomplete="new-password"
                                minlength="6"
                                required
                            >

                            <button
                                class="show-password"
                                type="button"
                                data-password="signupPassword"
                            >
                                Show
                            </button>
                        </div>

                        <p class="message" id="signupMessage"></p>

                        <button class="submit-button" type="submit">
                            Create Account
                        </button>
                    </form>

                    <p class="description form-description">
                        Create your account<br>
                        to access the<br>
                        company system.
                    </p>

                    <button
                        class="switch-button"
                        type="button"
                        data-page="signin"
                    >
                        Already registered? Sign in
                    </button>
                </div>

            </div>
        </section>

    </main>

    <!-- Connects index.html to the JavaScript file -->
    <script src="js/script.js"></script>
</body>
</html>
